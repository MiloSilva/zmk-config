name: Build ZMK firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano_v2
            shield: settings_reset
            artifact-name: settings_reset

          - board: nice_nano_v2
            shield: corne_left nice_view_adapter nice_view
            artifact-name: corne_left_nice_view

          - board: nice_nano_v2
            shield: corne_right nice_view_adapter nice_view
            artifact-name: corne_right_nice_view

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        run: west init -l config

      - name: West Update
        run: west update --fetch-opt=--filter=tree:0

      - name: West Zephyr Export
        run: west zephyr-export

      - name: Remove incompatible pointing.h include
        run: sed -i '/#include <dt-bindings\/zmk\/pointing.h>/d' config/corne.keymap

      - name: Build (${{ matrix.artifact-name }})
        run: |
          west build \
            -s zmk/app \
            -b ${{ matrix.board }} \
            -- \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" \
            -DSHIELD="${{ matrix.shield }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/zephyr/zmk.uf2

  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
      amend_commit: false
      install_branch: "main"
      keymap_patterns: "config/*.keymap"
      json_path: "config"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "keymap-drawer"
      destination: "both"
      parse_args: ""
      draw_args: ""